<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">    <title>Akshat Pandey</title>
    <title>{{ title }}</title>
    <link rel="stylesheet" href="../../css/blogpage.css">
    <link rel="stylesheet" href="../../css/pygments.css">
    <script>
        window.MathJax = {
            tex: {
              inlineMath: [['\\(', '\\)']],
              displayMath: [['\\[', '\\]']],
              processEscapes: true,
              processEnvironments: true
            },
            options: {
              ignoreHtmlClass: '.*',
              processHtmlClass: 'arithmatex'
            }
        };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <a href="/blog.html">Blog</a>
    {{ content }}
    <script>
      window.addEventListener('load', () => {
        document.querySelectorAll('.arithmatex').forEach(el => {
          const parentWidth = el.parentElement.clientWidth;
          if (el.scrollWidth > parentWidth) {
            const scale = parentWidth / (el.scrollWidth * 1.05);
            el.style.transform = `scale(${scale})`;
            el.style.transformOrigin = 'left center';
            el.style.display = 'inline-block';
            el.style.width = `${parentWidth}px`;
          }
        });
      });
    </script>
</body>
</html>
